services:
  db:
    image: postgres:16
    container_name: smart-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartops
      POSTGRES_PASSWORD: smartops
      POSTGRES_DB: smartops
    ports:
      - "5432:5432"
    volumes:
      - smart_ops_pg:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: smart-ops-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "6379:6379"
    volumes:
      - smart_ops_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  smart_ops_pg:
  smart_ops_redis:
